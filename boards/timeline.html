<!doctype html>
<html lang="ar" dir="ltr"><head><meta charset="utf-8"><title>06 Timeline board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;600&family=Noto+Kufi+Arabic:wght@300;400;600&display=swap" rel="stylesheet">
<style>
@page{size:250mm 250mm;margin:0}
html,body{margin:0;background:#e7e2d8}
body{width:250mm;height:250mm;overflow:hidden}
svg{display:block}
.ar{font-family:'Noto Kufi Arabic',sans-serif}
.en{font-family:'Readex Pro',sans-serif}
</style></head><body>
<svg id="b" xmlns="http://www.w3.org/2000/svg" width="250mm" height="250mm" viewBox="0 0 250 250"></svg>
<script>
// Board 06 · historical development. Paper, one red, dark mauve-grey, thin lines, vertical tags, grain.
// Data: extents exported from the atlas (GIS T1900/T1935, traced 1918/1942 plans, GHSL 1975–2020).
const C={paper:'#e7e2d8',ink:'#2d2830',mauve:'#5b5260',soft:'#9c949c',line:'#bdb4b4',red:'#ec4a22',blue:'#a9c3d6'};
fetch('../data/board_timeline.json').then(r=>r.json()).then(D=>{
 const E=D.ex.filter(e=>e.y!==1986),svg=document.getElementById('b');let o='';
 const all=E.at(-1).r.flat(),bx=[Math.min(...all.map(p=>p[0])),Math.min(...all.map(p=>p[1])),Math.max(...all.map(p=>p[0])),Math.max(...all.map(p=>p[1]))];
 const proj=(box,X,Y,S)=>{const k=S/Math.max(box[2]-box[0],box[3]-box[1]),cx=(box[0]+box[2])/2,cy=(box[1]+box[3])/2;return p=>[(X+S/2+(p[0]-cx)*k).toFixed(2),(Y+S/2-(p[1]-cy)*k).toFixed(2)]};
 const path=(rings,P)=>rings.map(r=>'M'+r.map(p=>P(p).join(' ')).join('L')+'Z').join('');
 const lines=(ls,P)=>ls.map(part=>part.map(r=>'M'+r.map(p=>P(p).join(' ')).join('L')).join('')).join('');
 const T=(x,y,t,cls,size,fill,anchor='start',extra='')=>`<text x="${x}" y="${y}" class="${cls}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" ${extra}>${t}</text>`;
 // grain + defs
 o+=`<defs><filter id="g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .18  0 0 0 0 .15  0 0 0 0 .17  0 0 0 .55 0"/></filter>
  <pattern id="h" width="1.2" height="1.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="1.2" stroke="${C.mauve}" stroke-width=".22"/></pattern>
  <clipPath id="mapclip"><rect x="12" y="34" width="150" height="150"/></clipPath></defs>`;
 o+=`<rect width="250" height="250" fill="${C.paper}"/>`;
 // ---- header
 o+=T(12,24,'06','en',17,C.ink,'start','font-weight="200"')+T(36,15.5,'HISTORICAL DEVELOPMENT','en',3.4,C.ink,'start','letter-spacing=".9" font-weight="600"')+T(36,21.5,'التطور التاريخي · الدار البيضاء 1900–2020','ar',3.4,C.mauve);
 o+=`<line x1="12" y1="29" x2="238" y2="29" stroke="${C.ink}" stroke-width=".25"/>`;
 // ---- main map: tree rings
 const MX=12,MY=34,MS=150,P=proj([bx[0]-600,bx[1]-600,bx[2]+600,bx[3]+600],MX,MY,MS);
 o+=`<rect x="${MX}" y="${MY}" width="${MS}" height="${MS}" fill="#ded8cd"/>`;
 o+=`<g clip-path="url(#mapclip)">`;
 // bands: newest (largest) first, alternating hatch/plain so the rings read like a cut log
 [...E].reverse().forEach((e,i)=>{const fill=i%2?'#d6cfc4':'url(#h)';o+=`<path d="${path(e.r,P)}" fill="${fill}" fill-opacity="${i%2?1:.55}" fill-rule="evenodd"/>`});
 E.forEach((e,i)=>{const t=i/(E.length-1);o+=`<path d="${path(e.r,P)}" fill="none" stroke="${C.mauve}" stroke-width="${(.18+.32*t).toFixed(2)}" stroke-opacity="${(.45+.5*t).toFixed(2)}" ${e.traced||e.ghsl?'':'stroke-dasharray="1.2 .8"'}/>`});
 o+=`<path d="${lines(D.roads,P)}" fill="none" stroke="#f4f1ea" stroke-width=".22" stroke-opacity=".75"/>`;
 o+=`<path d="${path(D.bnd.flat(),P)}" fill="none" stroke="${C.ink}" stroke-width=".25" stroke-dasharray="2 1.2"/>`;
 // the origin: the 1900 city as one red mark
 o+=`<path d="${path(E[0].r,P)}" fill="${C.red}"/>`;
 o+=`</g>`;
 // instrument frame: ticks every 1 km with labels every 5 km
 const kmx=MS/((bx[2]-bx[0])+1200);
 o+=`<rect x="${MX}" y="${MY}" width="${MS}" height="${MS}" fill="none" stroke="${C.ink}" stroke-width=".3"/>`;
 for(let i=0;i*kmx*1000<=MS;i++){const x=MX+i*kmx*1000,big=i%5===0;o+=`<line x1="${x.toFixed(2)}" y1="${MY}" x2="${x.toFixed(2)}" y2="${MY-(big?2:1)}" stroke="${C.ink}" stroke-width=".2"/><line x1="${x.toFixed(2)}" y1="${MY+MS}" x2="${x.toFixed(2)}" y2="${MY+MS+(big?2:1)}" stroke="${C.ink}" stroke-width=".2"/>`;if(big)o+=T(x+.6,MY+MS+4,i+' km','en',1.9,C.mauve);
  const y=MY+i*kmx*1000;if(y<=MY+MS)o+=`<line x1="${MX}" y1="${y.toFixed(2)}" x2="${MX-(big?2:1)}" y2="${y.toFixed(2)}" stroke="${C.ink}" stroke-width=".2"/><line x1="${MX+MS}" y1="${y.toFixed(2)}" x2="${MX+MS+(big?2:1)}" y2="${y.toFixed(2)}" stroke="${C.ink}" stroke-width=".2"/>`}
 // north + scale
 o+=`<g transform="translate(${MX+MS-8},${MY+8})"><path d="M0 -4 L1.6 1.5 L0 .6 L-1.6 1.5 Z" fill="${C.ink}"/>${T(0,5,'N','en',2,C.ink,'middle')}</g>`;
 // vertical tags: one per record, on the east edge of each ring
 const TAG=[1900,1918,1942,1975,2000,2020];let ti=0;E.forEach((e,i)=>{if(!TAG.includes(e.y))return;const th=(-.2+ti++*.62)*Math.PI,dx=Math.cos(th),dy=Math.sin(th),pts=e.r.flat(),far=pts.reduce((a,p)=>p[0]*dx+p[1]*dy>a[0]*dx+a[1]*dy?p:a,pts[0]),[x,y]=P(far).map(Number);if(x>MX+MS-6||x<MX+4||y<MY+14||y>MY+MS-4)return;
  const red=i===0,col=red?C.red:C.ink,len=6+(i%3)*3.5,w=(String(e.y).length*2.1)+3;
  o+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y-len}" stroke="${col}" stroke-width=".2"/><rect x="${x-1.7}" y="${y-len-w}" width="3.4" height="${w}" fill="${col}"/>${T(x+.7,y-len-1.2,e.y,'en',2.2,'#f4f1ea','start',`transform="rotate(-90 ${x+.7} ${y-len-1.2})" letter-spacing=".25"`)}`});
 // ---- right column: the numbers, large and thin
 const RX=172;let ry=40;
 o+=T(RX,ry,'المدينة المبنية · km²','ar',3,C.mauve)+T(RX,ry+4.2,'BUILT-UP CITY','en',2.4,C.mauve,'start','letter-spacing=".6"');ry+=12;
 const maxK=E.at(-1).km2;
 E.forEach((e,i)=>{const red=i===0;o+=T(RX,ry,e.y,'en',7.2,red?C.red:C.ink,'start','font-weight="200"')+T(RX+26,ry,e.km2<10?e.km2.toFixed(1):Math.round(e.km2),'en',4.4,red?C.red:C.ink,'start','font-weight="300"');
  o+=`<line x1="${RX+43}" y1="${ry-1.6}" x2="${(RX+43+Math.max(.5,e.km2/maxK*23)).toFixed(2)}" y2="${ry-1.6}" stroke="${red?C.red:C.mauve}" stroke-width="1.1"/>`;
  ry+=13.4});
 // ---- the sentence
 o+=T(12,198,'من نقطة حمراء بنصف كيلومتر مربع إلى 155 كم²: المدينة المبنية كبرت ≈280 مرة في 120 سنة.','ar',4.6,C.ink);
 o+=T(12,204.5,'From a red dot of half a square kilometre to 155 km²: the built city grew about 280 times in 120 years.','en',3.2,C.mauve,'start','font-weight="300"');
 // ---- small multiples: growth step by step, red = added since the previous record
 const SM=[1918,1935,1942,1975,1990,2000,2020].map(y=>E.findIndex(e=>e.y===y)).filter(i=>i>0);const sw=30.2,sy=210;
 SM.forEach((ei,j)=>{const x=12+j*(sw+2.3),Q=proj([bx[0]-600,bx[1]-600,bx[2]+600,bx[3]+600],x,sy,sw),cur=E[ei],prev=E[ei-1];
  o+=`<rect x="${x}" y="${sy}" width="${sw}" height="${sw}" fill="#ded8cd"/>`;
  o+=`<path d="${path(cur.r,Q)}" fill="${C.red}" fill-opacity=".9"/><path d="${path(prev.r,Q)}" fill="${C.mauve}"/>`;
  E.slice(0,ei-1).forEach(e=>o+=`<path d="${path(e.r,Q)}" fill="none" stroke="#e7e2d8" stroke-width=".12"/>`);
  o+=`<rect x="${x}" y="${sy}" width="${sw}" height="${sw}" fill="none" stroke="${C.ink}" stroke-width=".2"/>`+T(x+1.2,sy+3.6,cur.y,'en',2.6,C.ink,'start','font-weight="600"')+T(x+sw-1.2,sy+3.6,'+'+Math.round(cur.km2-prev.km2),'en',2.2,C.red,'end')});
 // ---- footer: key + sources
 const fy=243.4;o+=`<rect x="12" y="${fy-2.4}" width="3" height="3" fill="${C.red}"/>`+T(16.5,fy,'أُضيف منذ السجل السابق · added since the previous record','ar',2.1,C.ink);
 o+=`<rect x="80" y="${fy-2.4}" width="3" height="3" fill="${C.mauve}"/>`+T(84.5,fy,'ما كان قبله · what was there before','ar',2.1,C.ink);
 o+=T(12,fy+4,'Sources: GHSL (JRC) 1975–2020, 100 m cells ≥15% built · 1918 + 1942 traced from the georeferenced plans · 1900 + 1935 studio GIS layers · the 1942 plan covers the centre only, so part of the 1942→1975 jump is the plan edge','en',1.6,C.mauve);
 o+=`<rect width="250" height="250" filter="url(#g)" opacity=".5" style="mix-blend-mode:multiply"/>`;
 svg.innerHTML=o;document.title='ready';
});
</script></body></html>
